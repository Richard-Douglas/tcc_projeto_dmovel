<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Teste API Google</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Jaldi:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/53a8598d41.js" crossorigin="anonymous"></script>

  <!-- API Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyByzY42x2N7pIkLvbcZxev6PtEYSl8gYZ0&libraries=places,directions,geometry" async defer></script>

<style>
    .border-danger {
        border: 2px solid #dc3545 !important;
    }
    .card {
        border-left: 4px solid #007bff;
    }

      body {
        font-family: 'Jaldi', sans-serif;
      }
      #mapa {
        height: 600px;
      }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-between m-0"> 
        <div class="col-5 row row-cols-1 p-3 border" id="inicio">
            <label for="start-point"><h3>Ponto de partida</h3></label>
            <input class="form-control" id="start-point" list="start-point-list" placeholder="Ponto de partida">
            <button class="btn btn-primary" onclick="ativarSelecaoPontos('start')">Selecionar no mapa</button>
        </div>
        
        <div class="col-5 row row-cols-1 p-3 border" id="final">
            <label for="end-point"><h3>Ponto final</h3></label>
            <input class="form-control" id="end-point" list="end-point-list" placeholder="Ponto de chegada">
            <button class="btn btn-primary" onclick="ativarSelecaoPontos('end')">Selecionar no mapa</button>
        </div>

        <div class="col-2 row row-cols-2 justify-content-between" id="buscar">
            <button class="btn btn-success col-6" onclick="gerarRota()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="btn btn-warning col-6" onclick="resetarEntradas()" title="Resetar">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>
  
    <div class="row row-cols-2">
      <div class="col-4 border">
        <h4>Rota</h4>
        <div id="pontos"></div>
      </div>
      <div class="col-8" id="mapa"></div>
    </div>

  </div>

  <script src="../static/js/planificador.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
